<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1b2434"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>"/>
<title>Seigneurie</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body.txt-lg { font-size: 118%; }
body.txt-xl { font-size: 136%; }
body {
  font-family: ui-monospace, 'Courier New', monospace;
  background: #141a26; color: #e8e4d8;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#app { display: flex; flex-direction: column; height: 100dvh; }
#hud {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px;
  background: #1b2434; border-bottom: 1px solid #2c3a52;
  padding: 6px 8px; font-size: 12px; flex: 0 0 auto;
}
.ttl { font-weight: bold; letter-spacing: 1px; }
.chip { background: #2c3a52; border-radius: 4px; padding: 2px 6px; white-space: nowrap; }
.chip.small { background: #232f44; font-size: 11px; }
.res { display: flex; flex-wrap: wrap; gap: 3px; }
.spacer { flex: 1; }
.btn {
  background: #2c3a52; color: #e8e4d8; border: none; border-radius: 4px;
  padding: 4px 8px; font-size: 12px; font-family: inherit; cursor: pointer;
  min-height: 30px; min-width: 34px;
}
.btn.on { background: #4a6b3a; }
.btn.danger { background: #5a3a3a; }
.btn.wide { width: 100%; margin-top: 6px; }
.btn.dis { color: #666; }
#mapwrap { position: relative; flex: 1 1 auto; overflow: hidden; min-height: 0; }
#cv {
  position: absolute; inset: 0; width: 100%; height: 100%;
  image-rendering: pixelated; touch-action: none; display: block;
  cursor: crosshair;
}
#overlay { position: absolute; inset: 0; pointer-events: none; }
#overlay .panel, #overlay .modalwrap { pointer-events: auto; }
.panel {
  position: absolute; background: #1b2434dd; border: 1px solid #2c3a52;
  border-radius: 4px; padding: 8px; font-size: 11px; line-height: 1.5;
  max-width: calc(100vw - 1rem);
}
#objpanel { left: 8px; top: 8px; }
#selpanel { right: 8px; top: 8px; width: 232px; }
.panel .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
.desc { color: #a8b0c0; font-style: italic; margin-bottom: 6px; }
.dim { color: #a8b0c0; }
.good { color: #7bd88f; }
.gold { color: #e8c35a; margin-top: 4px; }
#taxSlider { width: 100%; }
.toasts {
  position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 4px; width: 300px; max-width: 92vw;
}
.toast { border-radius: 4px; padding: 4px 10px; text-align: center; font-size: 11px; background: #2c3a52dd; }
.toast.good { background: #2f5a2fdd; }
.toast.bad { background: #5a2f2fdd; }
.flash {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  background: #5a3a3a; color: #ffb0a0; border-radius: 4px; padding: 4px 10px; font-size: 11px;
}
.hint {
  position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
  background: #2c3a52; border-radius: 4px; padding: 4px 10px; font-size: 11px; white-space: nowrap;
}
#tileinfo {
  position: absolute; bottom: 8px; left: 8px; background: #1b2434dd;
  border: 1px solid #2c3a52; border-radius: 4px; padding: 3px 8px;
  font-size: 11px; pointer-events: none; max-width: 60%;
}
.modalwrap {
  position: absolute; inset: 0; background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center; padding: 10px;
}
.modal {
  background: #1b2434; border: 2px solid #4a5a3a; border-radius: 6px;
  padding: 14px; width: 340px; max-width: 95vw; max-height: 85%;
  overflow: auto; font-size: 12px; line-height: 1.6;
}
.modal p { margin: 6px 0; }
.modal.big { width: 430px; }
#buildbar {
  display: flex; align-items: stretch; gap: 4px; overflow-x: auto;
  background: #1b2434; border-top: 1px solid #2c3a52;
  padding: 6px 8px; flex: 0 0 auto;
}
.bbtn {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex: 0 0 auto; width: 88px; background: #232f44; color: #e8e4d8;
  border: 1px solid #2c3a52; border-radius: 4px; padding: 4px 2px;
  font-size: 10px; font-family: inherit; cursor: pointer;
}
.bbtn.on { border-color: #e8c35a; background: #3a4c6b; }
.bbtn.off { background: #1a2130; color: #666; }
.bicon { font-size: 16px; }
.bcost { color: #a8b0c0; font-size: 9px; }
.self { align-self: center; font-size: 10px; white-space: nowrap; }
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="mapwrap">
    <canvas id="cv"></canvas>
    <div id="overlay"></div>
    <div id="tileinfo"></div>
  </div>
  <div id="buildbar"></div>
</div>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
